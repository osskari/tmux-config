set-option -g focus-events on

# enable colors
set -g default-terminal 'tmux-256color'

# prefix
set -g prefix C-b
unbind C-b
bind-key C-b send-prefix

# split windows
unbind s
bind s split-window -h -c "#{pane_current_path}"
unbind S
bind S split-window -v -c "#{pane_current_path}"

# reload config
unbind r
bind r source-file "$TMUX_HOME/tmux.conf" \; display-message "Config reloaded"

# resize panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# enable mouse
set -g mouse on

# scrollback
set -g history-limit 50000

# status line position
set-option -g status-position top

# 1 indexed panes and windows
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vim tmux navigator
# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# setup colorscheme
# --> Catppuccin (Macchiato)
set -ogq @thm_bg "#24273a"
set -ogq @thm_fg "#cad3f5"

# Colors
set -ogq @thm_rosewater "#f4dbd6"
set -ogq @thm_flamingo "#f0c6c6"
set -ogq @thm_pink "#f5bde6"
set -ogq @thm_mauve "#c6a0f6"
set -ogq @thm_red "#ed8796"
set -ogq @thm_maroon "#ee99a0"
set -ogq @thm_peach "#f5a97f"
set -ogq @thm_yellow "#eed49f"
set -ogq @thm_green "#a6da95"
set -ogq @thm_teal "#8bd5ca"
set -ogq @thm_sky "#91d7e3"
set -ogq @thm_sapphire "#7dc4e4"
set -ogq @thm_blue "#8aadf4"
set -ogq @thm_lavender "#b7bdf8"

# Surfaces and overlays
set -ogq @thm_subtext_1 "#a5adcb"
set -ogq @thm_subtext_0 "#b8c0e0"
set -ogq @thm_overlay_2 "#939ab7"
set -ogq @thm_overlay_1 "#8087a2"
set -ogq @thm_overlay_0 "#6e738d"
set -ogq @thm_surface_2 "#5b6078"
set -ogq @thm_surface_1 "#494d64"
set -ogq @thm_surface_0 "#363a4f"
set -ogq @thm_mantle "#1e2030"
set -ogq @thm_crust "#181926"

# reset theme so that changes take proper effect on config source
set-option -ug status-style
set-option -ug status-left
set-option -ug status-right
set-option -ug window-status-format
set-option -ug window-status-current-format
set-option -ug pane-border-style
set-option -ug pane-active-border-style
set-option -ug message-style
set-option -ug status-right-length
set-option -ug status-left-length
set-option -ug status-justify
set-option -ug status-interval

# set theme

# even out lengths
set -g status-left-length 500
set -g status-right-length 500

# refresh values every 5 seconds
set -g status-interval 5

# center window list
set -g status-justify centre

# set status style
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"

# set window status
setw -g window-status-format '#[fg=#{@thm_fg}] #I #W '
setw -g window-status-current-format '#[fg=#{@thm_mauve},bold] #I #W '

# set left status content
set -g status-left ''
set -ag status-left ' #[fg=#{@thm_fg}]#{host} #[fg=#{@thm_surface_0}]│'
set -ag status-left ' #[fg=#{@thm_fg}]#S #[fg=#{@thm_surface_0}]│'
set -ag status-left ' #[fg=#{@thm_fg}]⏳#($TMUX_HOME/scripts/uptime.sh) #[fg=#{@thm_surface_0}]│'
set -ag status-left ' #[fg=#{@thm_fg}]⌚%H:%M #[fg=#{@thm_surface_0}]│'

# set right statis content
set -g  status-right ''
set -ag status-right '#[fg=#{@thm_surface_0}]│#{cpu_fg_color} CPU: #{cpu_percentage} '
set -ag status-right '#[fg=#{@thm_surface_0}]│#{ram_fg_color} RAM: #{ram_percentage} '
set -ag status-right '#[fg=#{@thm_surface_0}]│#{gpu_fg_color} GPU: #{gpu_percentage} '
set -ag status-right '#[fg=#{@thm_surface_0}]│#[fg=#{@thm_fg}] %d-%b-%y '

# start cpu widget
run-shell "#{TMUX_HOME}/plugins/cpu/cpu.tmux"
